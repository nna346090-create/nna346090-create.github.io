name: Sync Baidu Netdisk

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          pip install requests pynacl

      - name: Sync Baidu folders
        env:
          BAIDU_APP_KEY: ${{ secrets.BAIDU_APP_KEY }}
          BAIDU_SECRET_KEY: ${{ secrets.BAIDU_SECRET_KEY }}
          BAIDU_AUTH_CODE: ${{ secrets.BAIDU_AUTH_CODE }}
          BAIDU_REFRESH_TOKEN: ${{ secrets.BAIDU_REFRESH_TOKEN }}
          GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}

        run: |
          python <<'PY'
          import os
          import json
          import base64
          import requests
          from datetime import datetime, timezone
          from nacl.public import PublicKey, SealedBox

          APP_KEY = os.environ["BAIDU_APP_KEY"]
          SECRET_KEY = os.environ["BAIDU_SECRET_KEY"]
          AUTH_CODE = os.environ.get("BAIDU_AUTH_CODE", "")
          REFRESH_TOKEN = os.environ.get("BAIDU_REFRESH_TOKEN", "")
          GH_PAT = os.environ["GH_SECRETS_PAT"]
          REPO = os.environ["GITHUB_REPOSITORY"]

          TOKEN_URL = "https://openapi.baidu.com/oauth/2.0/token"

          # ============================================================
          # 保存 Refresh Token 到 GitHub Secrets
          # ============================================================

          def save_refresh_token(token):
              if not token:
                  return

              public_key_url = (
                  f"https://api.github.com/repos/{REPO}/actions/secrets/public-key"
              )

              headers = {
                  "Authorization": f"Bearer {GH_PAT}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              }

              r = requests.get(
                  public_key_url,
                  headers=headers,
                  timeout=30
              )
              r.raise_for_status()

              key_data = r.json()

              public_key = PublicKey(
                  base64.b64decode(key_data["key"])
              )

              encrypted = SealedBox(public_key).encrypt(
                  token.encode("utf-8")
              )

              secret_url = (
                  f"https://api.github.com/repos/{REPO}"
                  f"/actions/secrets/BAIDU_REFRESH_TOKEN"
              )

              payload = {
                  "encrypted_value":
                      base64.b64encode(encrypted).decode("utf-8"),
                  "key_id": key_data["key_id"],
              }

              r = requests.put(
                  secret_url,
                  headers=headers,
                  json=payload,
                  timeout=30
              )
              r.raise_for_status()

              print("Refresh token 已安全保存到 GitHub Secrets。")

          # ============================================================
          # 1. 获取 Access Token
          # ============================================================

          if REFRESH_TOKEN:
              print("Using saved refresh token...")

              params = {
                  "grant_type": "refresh_token",
                  "refresh_token": REFRESH_TOKEN,
                  "client_id": APP_KEY,
                  "client_secret": SECRET_KEY,
              }

              r = requests.get(
                  TOKEN_URL,
                  params=params,
                  timeout=30
              )

              data = r.json()

              if "error" in data:
                  raise RuntimeError(
                      "百度 Refresh Token 获取 Access Token 失败："
                      + str(data)
                  )

              access_token = data.get("access_token")

              new_refresh_token = data.get("refresh_token")

              if new_refresh_token:
                  save_refresh_token(new_refresh_token)

              if not access_token:
                  raise RuntimeError(
                      "百度没有返回 Access Token。"
                  )

              print("Refresh token succeeded.")

          else:
              if not AUTH_CODE:
                  raise RuntimeError(
                      "没有 BAIDU_AUTH_CODE，也没有 BAIDU_REFRESH_TOKEN。"
                  )

              print("首次运行：使用授权码获取 Access Token...")

              params = {
                  "grant_type": "authorization_code",
                  "code": AUTH_CODE,
                  "client_id": APP_KEY,
                  "client_secret": SECRET_KEY,
                  "redirect_uri": "oob",
              }

              r = requests.get(
                  TOKEN_URL,
                  params=params,
                  timeout=30
              )

              data = r.json()

              if "error" in data:
                  raise RuntimeError(
                      "百度 OAuth 获取 Token 失败："
                      + str(data)
                  )

              access_token = data.get("access_token")
              new_refresh_token = data.get("refresh_token")

              if not access_token:
                  raise RuntimeError(
                      "百度没有返回 Access Token。"
                  )

              if new_refresh_token:
                  save_refresh_token(new_refresh_token)

              print("百度 OAuth 验证成功。")

          # ============================================================
          # 2. 只读取 banana资源 文件夹
          # ============================================================

          ROOT_FOLDER = "/banana资源"

          print("")
          print("========================================")
          print("Reading:", ROOT_FOLDER)
          print("========================================")

          # ------------------------------------------------------------
          # 第一种方式：
          # xpan/file?method=list
          #
          # 这是普通目录列表，只读取指定目录的直接子项目。
          # ------------------------------------------------------------

          list_url = "https://pan.baidu.com/rest/2.0/xpan/file"

          params = {
              "method": "list",
              "access_token": access_token,
              "dir": ROOT_FOLDER,
              "start": 0,
              "limit": 1000,
              "order": "name",
              "web": "web",
          }

          r = requests.get(
              list_url,
              params=params,
              timeout=30
          )

          try:
              data = r.json()
          except Exception:
              raise RuntimeError(
                  "百度返回的不是有效 JSON："
                  + r.text[:500]
              )

          print("Baidu list HTTP status:", r.status_code)
          print("Baidu list errno:", data.get("errno", 0))

          if data.get("errno", 0) != 0:
              print(
                  "普通目录读取失败，准备尝试第二种官方接口..."
              )
              print("errmsg:", data.get("errmsg", ""))

              # --------------------------------------------------------
              # 第二种方式：
              # xpan/multimedia?method=listall
              #
              # recursion=0 表示不递归，只看当前目录。
              # --------------------------------------------------------

              listall_url = (
                  "https://pan.baidu.com/rest/2.0/xpan/multimedia"
              )

              params2 = {
                  "method": "listall",
                  "access_token": access_token,
                  "path": ROOT_FOLDER,
                  "recursion": 0,
                  "start": 0,
                  "limit": 1000,
              }

              r2 = requests.get(
                  listall_url,
                  params=params2,
                  timeout=30
              )

              try:
                  data2 = r2.json()
              except Exception:
                  raise RuntimeError(
                      "百度 listall 返回的不是有效 JSON："
                      + r2.text[:500]
                  )

              print(
                  "Baidu listall HTTP status:",
                  r2.status_code
              )

              print(
                  "Baidu listall errno:",
                  data2.get("errno", 0)
              )

              if data2.get("errno", 0) != 0:
                  raise RuntimeError(
                      "百度网盘目录读取失败。\n"
                      "普通 list："
                      + str(data)
                      + "\n"
                      "listall："
                      + str(data2)
                  )

              raw_items = data2.get("list", [])

          else:
              raw_items = data.get("list", [])

          print("")
          print("Total items received:", len(raw_items))
          print("")

          # ============================================================
          # 3. 严格过滤
          #
          # 只允许：
          #
          # /banana资源/某个文件夹
          #
          # 不允许：
          #
          # /其他根目录
          # /banana资源
          # /banana资源/文件夹/里面的文件
          # ============================================================

          folders = []

          expected_prefix = ROOT_FOLDER + "/"

          for item in raw_items:

              is_dir = item.get("isdir", 0) == 1

              if not is_dir:
                  continue

              path = item.get("path", "")

              # 必须属于 banana资源
              if not path.startswith(expected_prefix):
                  continue

              # 去掉 /banana资源/
              relative = path[len(expected_prefix):]

              # 第一层目录必须不能再出现 /
              if not relative:
                  continue

              if "/" in relative:
                  continue

              name = item.get(
                  "server_filename",
                  relative
              )

              folders.append({
                  "name": name,
                  "type": "folder",
                  "path": path,
                  "fsId": item.get("fs_id"),
                  "mtime": item.get(
                      "server_mtime",
                      0
                  ),
              })

          # 去重
          unique = {}

          for folder in folders:
              unique[folder["path"]] = folder

          folders = list(unique.values())

          # 排序
          folders.sort(
              key=lambda x: x["name"].lower()
          )

          print("========================================")
          print("Folders detected:")
          print("========================================")

          for folder in folders:
              print(
                  "📁",
                  folder["name"],
                  "->",
                  folder["path"]
              )

          print("")
          print("Folder count:", len(folders))

          # ============================================================
          # 4. 生成 baidu_folders.json
          #
          # 注意：
          # 不再碰 resources.json。
          # ============================================================

          output = {
              "updatedAt": datetime.now(
                  timezone.utc
              ).isoformat(),

              "source": "baidu",

              "folder": ROOT_FOLDER,

              "resources": folders,
          }

          with open(
              "baidu_folders.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print(
              "Written baidu_folders.json"
          )

          PY

      # ================================================================
      # 5. 只提交 baidu_folders.json
      # ================================================================

      - name: Commit and push
        run: |
          git config user.name "banana-sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add baidu_folders.json

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "sync Baidu folders"
          git push
