name: Sync Baidu Netdisk

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          pip install requests pynacl

      - name: Sync Baidu folders
        env:
          BAIDU_APP_KEY: ${{ secrets.BAIDU_APP_KEY }}
          BAIDU_SECRET_KEY: ${{ secrets.BAIDU_SECRET_KEY }}
          BAIDU_AUTH_CODE: ${{ secrets.BAIDU_AUTH_CODE }}
          BAIDU_REFRESH_TOKEN: ${{ secrets.BAIDU_REFRESH_TOKEN }}
          GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
          GH_REPO: ${{ github.repository }}
        run: |
          python <<'PY'
          import os
          import json
          import time
          import base64
          import requests
          from nacl import encoding, public

          APP_KEY = os.environ["BAIDU_APP_KEY"]
          SECRET_KEY = os.environ["BAIDU_SECRET_KEY"]
          AUTH_CODE = os.environ.get("BAIDU_AUTH_CODE", "").strip()
          REFRESH_TOKEN = os.environ.get("BAIDU_REFRESH_TOKEN", "").strip()
          GH_PAT = os.environ.get("GH_SECRETS_PAT", "").strip()
          GH_REPO = os.environ["GH_REPO"]

          BAIDU_FOLDER = "/banana资源"
          OUTPUT_FILE = "baidu_folders.json"

          def get_access_token():
              # 优先使用已经保存的 refresh token
              if REFRESH_TOKEN:
                  print("Using saved refresh token...")

                  url = "https://openapi.baidu.com/oauth/2.0/token"

                  params = {
                      "grant_type": "refresh_token",
                      "refresh_token": REFRESH_TOKEN,
                      "client_id": APP_KEY,
                      "client_secret": SECRET_KEY
                  }

                  r = requests.get(url, params=params, timeout=30)
                  data = r.json()

                  if data.get("access_token"):
                      print("Refresh token succeeded.")
                      return data

                  print("Refresh token failed:")
                  print(data)

              # 第一次授权时使用 auth code
              if not AUTH_CODE:
                  raise RuntimeError(
                      "No BAIDU_REFRESH_TOKEN and no BAIDU_AUTH_CODE available."
                  )

              print("Using authorization code...")

              url = "https://openapi.baidu.com/oauth/2.0/token"

              params = {
                  "grant_type": "authorization_code",
                  "code": AUTH_CODE,
                  "client_id": APP_KEY,
                  "client_secret": SECRET_KEY,
                  "redirect_uri": "oob"
              }

              r = requests.get(url, params=params, timeout=30)
              data = r.json()

              if not data.get("access_token"):
                  raise RuntimeError(
                      "Authorization failed: " + json.dumps(data, ensure_ascii=False)
                  )

              print("Authorization code succeeded.")
              return data

          token_data = get_access_token()

          access_token = token_data["access_token"]
          new_refresh_token = token_data.get("refresh_token")

          # ---------------------------------------------------------
          # 保存新的 refresh token 到 GitHub Secrets
          # ---------------------------------------------------------

          if new_refresh_token and GH_PAT:

              print("Saving refresh token to GitHub Secrets...")

              headers = {
                  "Authorization": f"Bearer {GH_PAT}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28"
              }

              key_url = (
                  f"https://api.github.com/repos/{GH_REPO}"
                  f"/actions/secrets/public-key"
              )

              key_response = requests.get(
                  key_url,
                  headers=headers,
                  timeout=30
              )

              key_response.raise_for_status()

              key_data = key_response.json()

              public_key = public.PublicKey(
                  base64.b64decode(key_data["key"])
              )

              sealed_box = public.SealedBox(public_key)

              encrypted = sealed_box.encrypt(
                  new_refresh_token.encode("utf-8")
              )

              encrypted_value = base64.b64encode(
                  encrypted
              ).decode("utf-8")

              secret_url = (
                  f"https://api.github.com/repos/{GH_REPO}"
                  f"/actions/secrets/BAIDU_REFRESH_TOKEN"
              )

              secret_response = requests.put(
                  secret_url,
                  headers=headers,
                  json={
                      "encrypted_value": encrypted_value,
                      "key_id": key_data["key_id"]
                  },
                  timeout=30
              )

              secret_response.raise_for_status()

              print("Refresh token saved.")

          # ---------------------------------------------------------
          # 获取百度网盘文件列表
          #
          # 注意：
          # 这里使用 listall，并且最终再次检查完整 path。
          # 即使百度接口返回了其他目录，也会被下面的严格过滤排除。
          # ---------------------------------------------------------

          print("Reading:", BAIDU_FOLDER)

          list_url = "https://pan.baidu.com/rest/2.0/xpan/multimedia"

          all_items = []

          start = 0
          limit = 1000

          while True:

              params = {
                  "method": "listall",
                  "access_token": access_token,
                  "path": BAIDU_FOLDER,
                  "recursion": 1,
                  "start": start,
                  "limit": limit,
                  "web": 1
              }

              response = requests.get(
                  list_url,
                  params=params,
                  timeout=60
              )

              response.raise_for_status()

              data = response.json()

              if data.get("errno", 0) != 0:
                  raise RuntimeError(
                      "Baidu listall failed: "
                      + json.dumps(data, ensure_ascii=False)
                  )

              items = data.get("list", [])

              print(
                  f"Received {len(items)} items "
                  f"(start={start})"
              )

              if not items:
                  break

              all_items.extend(items)

              if len(items) < limit:
                  break

              start += len(items)

              if start > 100000:
                  break

          print("Total items received:", len(all_items))

          # ---------------------------------------------------------
          # 严格筛选：
          #
          # 只允许：
          # /banana资源/某个文件夹
          #
          # 不允许：
          # /banana资源
          # /banana资源/某文件夹/文件.mp4
          # /其他根目录/xxx
          # ---------------------------------------------------------

          prefix = BAIDU_FOLDER.rstrip("/") + "/"

          folders = []

          for item in all_items:

              if int(item.get("isdir", 0)) != 1:
                  continue

              path = item.get("path", "")

              if not path.startswith(prefix):
                  continue

              relative = path[len(prefix):].strip("/")

              # 必须只有一层
              if not relative:
                  continue

              if "/" in relative:
                  continue

              name = item.get(
                  "server_filename",
                  relative
              )

              folders.append({
                  "name": name,
                  "type": "folder",
                  "path": path,
                  "fsId": item.get("fs_id"),
                  "mtime": item.get(
                      "server_mtime",
                      item.get("local_mtime", 0)
                  )
              })

          # 去重
          unique = {}

          for folder in folders:
              unique[folder["path"]] = folder

          folders = list(unique.values())

          folders.sort(
              key=lambda x: x["name"].lower()
          )

          print("")
          print("===== Folders detected =====")

          for folder in folders:
              print(
                  folder["name"],
                  "->",
                  folder["path"]
              )

          print("============================")
          print("Folder count:", len(folders))

          # ---------------------------------------------------------
          # 重要：
          # 不再写 resources.json
          # 只写 baidu_folders.json
          #
          # 因此不会破坏你原来的网站资源。
          # ---------------------------------------------------------

          output = {
              "updatedAt": time.strftime(
                  "%Y-%m-%dT%H:%M:%SZ",
                  time.gmtime()
              ),
              "source": "baidu",
              "folder": BAIDU_FOLDER,
              "resources": folders
          }

          with open(
              OUTPUT_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print(
              f"Written {OUTPUT_FILE}"
          )

          PY

      - name: Commit and push
        run: |
          git config user.name "banana-sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add baidu_folders.json

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "sync Baidu folders"
          git push
