<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>banana资源库</title>

<style>
body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:#f7f7f7;
margin:0;
padding:20px;
}

h1{
text-align:center;
color:#ff6b5f;
}

.search{
display:flex;
gap:10px;
margin-bottom:20px;
}

input{
flex:1;
padding:12px;
border-radius:10px;
border:1px solid #ddd;
font-size:16px;
}

button{
border:0;
border-radius:10px;
padding:10px 15px;
background:#ff6b5f;
color:white;
}

.category{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-bottom:20px;
}

.category button{
background:white;
color:#555;
border:1px solid #ddd;
}

.category .active{
background:#ff6b5f;
color:white;
}

.card{
background:white;
border-radius:15px;
padding:15px;
margin-bottom:15px;
box-shadow:0 3px 10px #ddd;
}

.name{
font-size:18px;
font-weight:bold;
}

.tag{
display:inline-block;
background:#ffe4df;
color:#ff6b5f;
padding:4px 8px;
border-radius:8px;
font-size:12px;
margin:8px 0;
}

a{
display:block;
margin-top:8px;
color:#1677ff;
text-decoration:none;
}
</style>

</head>

<body>

<h1>🍌 banana资源库</h1>

<div class="search">
<input id="search" placeholder="搜索资源名称">
<button onclick="render()">搜索</button>
</div>


<div class="category">
<button class="active" onclick="setCat('全部',this)">全部</button>
<button onclick="setCat('短剧区',this)">📺短剧区</button>
<button onclick="setCat('影视区',this)">🎬影视区</button>
<button onclick="setCat('小说区',this)">📚小说区</button>
<button onclick="setCat('学习资料',this)">📖学习资料</button>
<button onclick="setCat('动漫区',this)">🎨动漫区</button>
</div>


<div id="list"></div>


<script>

let category="全部";


let data=[

{
name:"早春晴朗",
cat:"小说区",
baidu:"https://pan.baidu.com/s/15qUAK4rJPMK2HzWWS2wn9Q?pwd=N149",
quark:""
},

{
name:"纸鸢",
cat:"小说区",
baidu:"https://pan.baidu.com/s/1946thTCaXfjDdVBw3epfNw?pwd=P4yL",
quark:""
},

{
name:"The Other Self二季全+番外",
cat:"影视区",
baidu:"https://pan.baidu.com/s/1l-4xU77KqSaPkHNJzwr7Wg?pwd=Z2ao",
quark:""
},

{
name:"高考零分作文精选大全",
cat:"学习资料",
baidu:"https://pan.baidu.com/s/1YRgnf1KU3-UKRuyimdHZmg?pwd=GM16",
quark:"https://pan.quark.cn/s/14c96aba32b2"
},

{
name:"BL作者冻感超人合集",
cat:"小说区",
baidu:"https://pan.baidu.com/s/110CinTSLfIAaH1JX4U0UjQ?pwd=VLS6",
quark:""
},

{
name:"绝色少爷与纯情暗卫",
cat:"短剧区",
baidu:"https://pan.baidu.com/s/1MvOI-IJvSIuW3y2H6L31Yg?pwd=2dMW",
quark:""
},

{
name:"BG作者姑娘别哭小说合集",
cat:"小说区",
baidu:"",
quark:"https://pan.quark.cn/s/290ccfe8fc36"
}

];


function setCat(c,btn){

category=c;

document.querySelectorAll(".category button")
.forEach(x=>x.classList.remove("active"));

btn.classList.add("active");

render();

}



function render(){

let key=document.getElementById("search").value;

let html="";


data.filter(x=>

(category=="全部"||x.cat==category)
&&
x.name.includes(key)

)
.forEach(x=>{

html+=`

<div class="card">

<div class="name">${x.name}</div>

<div class="tag">${x.cat}</div>


${x.baidu?
`<a href="${x.baidu}" target="_blank">
📦 百度网盘
</a>`:""}


${x.quark?
`<a href="${x.quark}" target="_blank">
☁️ 夸克网盘
</a>`:""}


</div>

`;

});


document.getElementById("list").innerHTML=
html||"暂无资源";

}


render();

</script>


</body>
</html>
