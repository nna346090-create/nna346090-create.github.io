<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0,
maximum-scale=1.0, minimum-scale=1.0,
user-scalable=no">

<title>banana资源库</title>


<style>

/* 页面 */

body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:#f7f7f7;
margin:0;
padding:20px;
}


/* 顶部滚动公告 */

.notice-scroll{
width:100%;
overflow:hidden;
background:#fff7e6;
border-radius:12px;
margin-bottom:15px;
padding:10px 0;
box-sizing:border-box;
white-space:nowrap;
}

.notice-scroll span{
display:inline-block;
padding-left:100%;
animation:scrollNotice 18s linear infinite;
color:#666;
font-size:14px;
}

@keyframes scrollNotice{

0%{
transform:translateX(0);
}

100%{
transform:translateX(-100%);
}

}


/* 标题 */

h1{
text-align:center;
margin-bottom:18px;
}


/* 标题下面的备注 */

.subtitle{
text-align:center;
color:#999;
font-size:12px;
margin-top:-12px;
margin-bottom:15px;
}


/* 搜索区域 */

.search{
background:white;
padding:20px;
border-radius:16px;
}


/* 搜索框 */

input{
width:70%;
padding:12px;
border-radius:10px;
border:1px solid #ddd;
box-sizing:border-box;
}


/* 搜索按钮 */

button{
padding:12px 18px;
border:0;
border-radius:10px;
background:#ff7b5c;
color:white;
}


/* 分类区域 */

.categories{
display:flex;
gap:5px;
margin-top:15px;
overflow-x:auto;
white-space:nowrap;
-webkit-overflow-scrolling:touch;
scrollbar-width:none;
}


/* 隐藏滚动条 */

.categories::-webkit-scrollbar{
display:none;
}


/* 分类按钮 */

.cat{
background:white;
padding:8px 10px;
border-radius:8px;
text-align:center;
font-size:10px;
white-space:nowrap;
flex-shrink:0;
}


/* 当前分类 */

.cat.active{
background:#ff7b5c;
color:white;
}


/* 资源卡片 */

.card{
background:white;
padding:15px;
border-radius:15px;
margin-bottom:15px;
}


/* 资源名称 */

.name{
font-size:18px;
font-weight:bold;
}


/* 网盘链接 */

a{
color:#267cff;
text-decoration:none;
display:inline-block;
margin-top:8px;
}


/* 网盘链接行 */

.link-row{
display:flex;
align-items:center;
gap:10px;
margin-top:8px;
}


/* 网盘链接行里的链接 */

.link-row a{
margin-top:0;
}


/* 复制按钮 */

.copy-btn{
padding:6px 10px;
border:0;
border-radius:8px;
background:#eee;
color:#555;
font-size:12px;
white-space:nowrap;
}


/* 复制成功 */

.copy-btn.copied{
background:#67c23a;
color:white;
}


/* 底部 */

.footer{
text-align:center;
color:#888;
font-size:13px;
padding:25px 10px;
line-height:1.8;
}

</style>

</head>


<body>


<!-- 顶部滚动公告 -->

<div class="notice-scroll">

<span>
网站提供海量免费资源，包括，最新影视剧、广播剧、漫画、小说、各类学习资料等等⚠️【温馨提示】:本站仅提供资源索引与搜索服务，链接来源于互联网公开信息，请勿相信资源链接内的任何广告信息哦
</span>

</div>


<!-- 网站标题 -->

<h1>🍌 banana资源库</h1>


<!-- 标题下面的备注 -->

<div class="subtitle">
提供影视📺/小说📚/漫画/学习资料/破解软件等。。。
</div>


<!-- 搜索区域 -->

<div class="search">

<input
id="search"
placeholder="搜索资源名称"
>

<button onclick="search()">
搜索
</button>


<!-- 分类 -->

<div class="categories">

<div class="cat active"
onclick="filterCategory('全部',this)">
全部
</div>

<div class="cat"
onclick="filterCategory('影视区',this)">
📺影视区
</div>

<div class="cat"
onclick="filterCategory('小说区',this)">
📚小说区
</div>

<div class="cat"
onclick="filterCategory('广播剧区',this)">
🎧广播剧区
</div>

<div class="cat"
onclick="filterCategory('学习资料区',this)">
📖学习资料区
</div>

<div class="cat"
onclick="filterCategory('漫画区',this)">
🎨漫画区
</div>

</div>

</div>


<!-- 资源列表 -->

<div id="list"></div>


<!-- 网站底部 -->

<div class="footer">

banana资源库<br>

本站仅供交流学习，所有内容均为采集，数据来自于互联网

</div>



<script>


/* 资源数据 */

let data=[];


/* 当前分类 */

let currentCategory="全部";


/* 获取资源 JSON */

fetch("date.json")
.then(res=>res.json())
.then(res=>{

data=res;

/* 页面打开后直接显示全部资源 */

show(data);

});



/* 显示资源 */

function show(arr){

let html="";


arr.forEach(item=>{

html+=`

<div class="card">

<div class="name">
${item.name}
</div>

<div>
分类：${item.type}
</div>


${item.baidu?
`
<div class="link-row">

<a href="${item.baidu}" target="_blank">
百度网盘
</a>

<button
class="copy-btn"
onclick="copyLink('${item.baidu}',this)">
复制链接
</button>

</div>
`
:""}


${item.quark?
`
<div class="link-row">

<a href="${item.quark}" target="_blank">
夸克网盘
</a>

<button
class="copy-btn"
onclick="copyLink('${item.quark}',this)">
复制链接
</button>

</div>
`
:""}


${item.xunlei?
`
<div class="link-row">

<a href="${item.xunlei}" target="_blank">
迅雷网盘
</a>

<button
class="copy-btn"
onclick="copyLink('${item.xunlei}',this)">
复制链接
</button>

</div>
`
:""}


</div>

`;

});


document.getElementById("list").innerHTML=html;

}



/* 复制链接 */

function copyLink(link,button){

if(navigator.clipboard){

navigator.clipboard.writeText(link)
.then(()=>{

button.innerText="已复制 ✓";

button.classList.add("copied");


setTimeout(()=>{

button.innerText="复制链接";

button.classList.remove("copied");

},1500);

})
.catch(()=>{

fallbackCopy(link,button);

});

}else{

fallbackCopy(link,button);

}

}



/* 兼容部分手机浏览器的复制方法 */

function fallbackCopy(link,button){

let textarea=document.createElement("textarea");

textarea.value=link;

textarea.style.position="fixed";

textarea.style.opacity="0";

document.body.appendChild(textarea);

textarea.focus();

textarea.select();

try{

document.execCommand("copy");

button.innerText="已复制 ✓";

button.classList.add("copied");


setTimeout(()=>{

button.innerText="复制链接";

button.classList.remove("copied");

},1500);

}catch(e){

button.innerText="复制失败";

setTimeout(()=>{

button.innerText="复制链接";

},1500);

}

document.body.removeChild(textarea);

}



/* 分类筛选 */

function filterCategory(category,element){

currentCategory=category;


/* 修改当前分类 */

document
.querySelectorAll(".cat")
.forEach(item=>{

item.classList.remove("active");

});

element.classList.add("active");


/* 获取搜索关键词 */

let key=document
.getElementById("search")
.value
.trim();


/* 初始使用全部资源 */

let result=data;


/* 按分类筛选 */

if(category!=="全部"){

result=result.filter(item=>
item.type===category
);

}


/* 同时按照关键词筛选 */

if(key){

result=result.filter(item=>
item.name.includes(key)
);

}


/* 显示结果 */

show(result);

}



/* 搜索 */

function search(){

let key=document
.getElementById("search")
.value
.trim();


/* 初始使用全部资源 */

let result=data;


/* 按当前分类筛选 */

if(currentCategory!=="全部"){

result=result.filter(item=>
item.type===currentCategory
);

}


/* 搜索框为空 */

if(!key){

show(result);

return;

}


/* 按关键词筛选 */

result=result.filter(item=>
item.name.includes(key)
);


/* 显示结果 */

show(result);

}



/* 回车自动搜索 */

document
.getElementById("search")
.addEventListener("keydown",function(e){

if(e.key==="Enter"){

search();

}

});


</script>



<!-- 网站公告弹窗 -->

<div
id="noticeBox"
style="
position:fixed;
top:0;
left:0;
right:0;
bottom:0;
background:rgba(0,0,0,0.45);
display:flex;
align-items:center;
justify-content:center;
z-index:9999;
">


<div
style="
background:white;
width:80%;
max-width:360px;
border-radius:20px;
padding:25px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,.2);
">


<h2 style="color:#ff6f61;">

温馨提示

</h2>


<p
style="
font-size:16px;
line-height:1.7;
color:#555;
text-align:left;
">

✅本站仅供交流学习，所有内容均来自于互联网，如有侵权，请及时联系我们进行处理<br>

🔍可使用搜索功能查找资源<br>

🔍搜索时尽量输入2-3个字的关键词

</p>


<button
onclick="closeNotice()"
style="
background:#ff7568;
color:white;
border:none;
padding:12px 35px;
border-radius:30px;
font-size:16px;
">

确认

</button>


</div>

</div>



<script>


/* 关闭公告 */

function closeNotice(){

document
.getElementById("noticeBox")
.style.display="none";

}


</script>


</body>

</html>
