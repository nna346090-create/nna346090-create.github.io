            color: #222;
        }

            padding: 35px 20px 30px;

        }

        }

        }

        .search-box {

            top: 10px;

        }

        .search-box input {
            width: 100%;
            padding: 15px 18px;
            border: none;
            border-radius: 14px;
            background: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            font-size: 16px;
            outline: none;
        }

        .resource {
            background: white;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 15px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
        }

        .resource-name {
            font-size: 18px;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .button {
            display: inline-block;
            text-decoration: none;
            padding: 11px 16px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            color: white;
        }

        .baidu {
            background: #1677ff;
        }

        .quark {
            background: #18a957;
        }

        .empty {
            text-align: center;
            color: #888;
            padding: 30px 10px;
            display: none;
        }

        .footer {

            color: #999;
            font-size: 12px;
            margin-top: 30px;
            line-height: 1.6;
        }
    </style>
</head>

    <script>
        const searchInput = document.getElementById("search");
        const resources = document.querySelectorAll(".resource");
        const empty = document.getElementById("empty");

        searchInput.addEventListener("input", function () {

            const keyword = this.value
                .trim()
                .toLowerCase();

            let found = 0;

            resources.forEach(function (resource) {

                const name = resource
                    .getAttribute("data-name")
                    .toLowerCase();

                if (name.includes(keyword)) {
                    resource.style.display = "block";
                    found++;
                } else {
                    resource.style.display = "none";
                }

            });

            if (found === 0) {
                empty.style.display = "block";
            } else {
                empty.style.display = "none";
            }

        });
    </script>
