<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🍌 banana资源库</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    .container {
      width: min(900px, 92%);
      margin: 0 auto;
      padding: 35px 0 50px;
    }

    h1 {
      text-align: center;
      margin: 0 0 8px;
      font-size: 30px;
    }

    .subtitle {
      text-align: center;
      color: #888;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .search-box {
      position: sticky;
      top: 10px;
      z-index: 10;
      margin-bottom: 25px;
    }

    #searchInput {
      width: 100%;
      padding: 15px 18px;
      border: 1px solid #ddd;
      border-radius: 14px;
      font-size: 16px;
      outline: none;
      background: white;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    #searchInput:focus {
      border-color: #999;
    }

    #resourceList {
      display: grid;
      gap: 14px;
    }

    .resource {
      background: white;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.05);
    }

    .resource-name {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 13px;
      word-break: break-word;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .btn {
      display: inline-block;
      padding: 9px 14px;
      border-radius: 9px;
      text-decoration: none;
      font-size: 14px;
      color: white;
      background: #333;
    }

    .btn:active {
      opacity: 0.7;
    }

    .empty {
      text-align: center;
      color: #999;
      padding: 40px 10px;
      display: none;
    }

    .loading {
      text-align: center;
      color: #999;
      padding: 30px;
    }

    footer {
      text-align: center;
      color: #aaa;
      font-size: 12px;
      margin-top: 40px;
      line-height: 1.8;
    }

    @media (max-width: 600px) {
      .container {
        width: 94%;
        padding-top: 25px;
      }

      h1 {
        font-size: 26px;
      }

      .resource {
        padding: 16px;
      }

      .btn {
        flex: 1;
        text-align: center;
        min-width: 120px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🍌 banana资源库</h1>

    <div class="subtitle">
      搜索资源名称，点击即可打开分享链接
    </div>

    <div class="search-box">
      <input
        id="searchInput"
        type="search"
        placeholder="🔍 搜索资源名称..."
        autocomplete="off"
      >
    </div>

    <div id="resourceList">
      <div class="loading" id="loading">
        正在加载资源……
      </div>
    </div>

    <div class="empty" id="empty">
      没有找到相关资源
    </div>

    <footer>
      🍌 banana资源库<br>
      请确保你分享的资源具有合法的分享权限
    </footer>

  </div>

  <script>
    const resourceList = document.getElementById("resourceList");
    const searchInput = document.getElementById("searchInput");
    const empty = document.getElementById("empty");
    const loading = document.getElementById("loading");

    let resources = [];

    function createResourceCard(item) {
      const card = document.createElement("div");
      card.className = "resource";

      const name = document.createElement("div");
      name.className = "resource-name";

      name.textContent = "📁 " + (item.name || "未命名资源");

      const buttons = document.createElement("div");
      buttons.className = "buttons";

      if (item.baidu) {
        const baiduBtn = document.createElement("a");

        baiduBtn.className = "btn";
        baiduBtn.textContent = "打开百度网盘文件夹";
        baiduBtn.href = item.baidu;
        baiduBtn.target = "_blank";
        baiduBtn.rel = "noopener noreferrer";

        buttons.appendChild(baiduBtn);
      }

      card.appendChild(name);
      card.appendChild(buttons);

      return card;
    }

    function renderResources(list) {
      resourceList.innerHTML = "";

      if (list.length === 0) {
        empty.style.display = "block";
        return;
      }

      empty.style.display = "none";

      list.forEach(item => {
        resourceList.appendChild(
          createResourceCard(item)
        );
      });
    }

    async function loadResources() {
      try {
        const response = await fetch(
          "./resources.json?t=" + Date.now(),
          {
            cache: "no-store"
          }
        );

        if (!response.ok) {
          throw new Error("resources.json 加载失败");
        }

        const data = await response.json();

        if (Array.isArray(data)) {
          resources = data;
        } else if (Array.isArray(data.resources)) {
          resources = data.resources;
        } else {
          resources = [];
        }

        resources = resources.filter(item =>
          item &&
          item.name &&
          item.baidu
        );

        loading.remove();

        renderResources(resources);

      } catch (error) {
        console.error(error);

        loading.textContent =
          "资源加载失败，请稍后刷新页面";

        resources = [];
      }
    }

    searchInput.addEventListener("input", function () {
      const keyword = this.value.trim().toLowerCase();

      if (!keyword) {
        renderResources(resources);
        return;
      }

      const filtered = resources.filter(item =>
        String(item.name || "")
          .toLowerCase()
          .includes(keyword)
      );

      renderResources(filtered);
    });

    loadResources();
  </script>

</body>
</html>
