<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>banana资源库</title>

<style>
body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:#f7f7f7;
margin:0;
padding:20px;
}

h1{
text-align:center;
}

.search{
background:white;
padding:20px;
border-radius:16px;
}

input{
width:70%;
padding:12px;
border-radius:10px;
border:1px solid #ddd;
}

/* 搜索按钮 */
button{
padding:12px 18px;
border:0;
border-radius:10px;
background:#ff7b5c;
color:white;
}

/* 分类区域 */
.categories{
display:grid;
grid-template-columns:repeat(6,1fr);
gap:6px;
margin:20px 0;
}

/* 分类按钮 */
.cat{
background:white;
padding:8px 2px;
border-radius:14px;
cursor:pointer;
font-size:12px;
text-align:center;
white-space:nowrap;
overflow:hidden;
}

.active{
background:#ff7b5c;
color:white;
}

.card{
background:white;
padding:15px;
border-radius:15px;
margin-bottom:15px;
}

.name{
font-size:18px;
font-weight:bold;
}

a{
color:#267cff;
text-decoration:none;
display:block;
margin-top:8px;
}.footer{
text-align:center;
color:#888;
font-size:13px;
padding:25px 10px;
line-height:1.8;
}
</style>

</head>

<body>

<h1>🍌 banana资源库</h1>

<div class="search">

<input id="search" placeholder="搜索资源名称">

<button onclick="search()">搜索</button>

</div>


<div class="categories">

<div class="cat active" onclick="filter('全部',this)">全部</div>

<div class="cat" onclick="filter('影视区',this)">📺影视区</div>

<div class="cat" onclick="filter('小说区',this)">📚小说区</div>

<div class="cat" onclick="filter('广播剧区',this)">🎧广播剧区</div>

<div class="cat" onclick="filter('学习资料区',this)">📖学习资料区</div>

<div class="cat" onclick="filter('漫画区',this)">🎨漫画区</div>

</div>


<div id="list"></div>
<div class="footer">
banana资源库<br>
本站仅供交流学习，所有内容均为采集，数据来自于互联网
</div>

<script>

let data=[];

fetch("date.json")
.then(res=>res.json())
.then(res=>{
    data=res;
    show(data);
});

let current="全部";


function show(arr){

let html="";

arr.forEach(item=>{

html+=`

<div class="card">

<div class="name">${item.name}</div>

<div>分类：${item.type}</div>

${item.baidu?
`<a href="${item.baidu}" target="_blank">百度网盘</a>`
:""}

${item.quark?
`<a href="${item.quark}" target="_blank">夸克网盘</a>`
:""}

</div>

`;

});


document.getElementById("list").innerHTML=html;

}


function filter(type,el){

current=type;

document.querySelectorAll(".cat").forEach(x=>x.classList.remove("active"));

el.classList.add("active");

if(type=="全部"){
show(data);
}else{
show(data.filter(x=>x.type==type));
}

}


function search(){

let key=document.getElementById("search").value;

show(data.filter(x=>

x.name.includes(key)&&

(current=="全部"||x.type==current)

));

}


show(data);

</script>


<!-- 网站公告弹窗 -->
<div id="noticeBox" style="
position:fixed;
top:0;
left:0;
right:0;
bottom:0;
background:rgba(0,0,0,0.45);
display:flex;
align-items:center;
justify-content:center;
z-index:9999;
">

<div style="
background:white;
width:80%;
max-width:360px;
border-radius:20px;
padding:25px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,.2);
">

<h2 style="color:#ff6f61;">
🍌 banana资源库
</h2>

<p style="
font-size:16px;
line-height:1.8;
color:#555;
">
本站仅供交流学习，所有内容均为菜集，数据来自于互联网<br>
如有侵权，请联系我们<br>
可使用搜索功能查找资源
</p>

<button onclick="closeNotice()" style="
background:#ff7568;
color:white;
border:none;
padding:12px 35px;
border-radius:30px;
font-size:16px;
">
知道了
</button>

</div>
</div>


<script>
function closeNotice(){
document.getElementById("noticeBox").style.display="none";
}
</script>

</body>
</html>
