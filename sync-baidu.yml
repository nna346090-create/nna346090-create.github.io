name: Sync Baidu Netdisk

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          pip install requests pynacl

      - name: Sync Baidu Netdisk
        env:
          BAIDU_APP_KEY: ${{ secrets.BAIDU_APP_KEY }}
          BAIDU_SECRET_KEY: ${{ secrets.BAIDU_SECRET_KEY }}
          BAIDU_AUTH_CODE: ${{ secrets.BAIDU_AUTH_CODE }}
          BAIDU_REFRESH_TOKEN: ${{ secrets.BAIDU_REFRESH_TOKEN }}
          GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python <<'PY'
          import os
          import json
          import base64
          import requests
          from nacl.public import PublicKey, SealedBox

          APP_KEY = os.environ["BAIDU_APP_KEY"]
          SECRET_KEY = os.environ["BAIDU_SECRET_KEY"]
          AUTH_CODE = os.environ.get("BAIDU_AUTH_CODE", "")
          REFRESH_TOKEN = os.environ.get("BAIDU_REFRESH_TOKEN", "")
          GH_PAT = os.environ["GH_SECRETS_PAT"]
          REPO = os.environ["GITHUB_REPOSITORY"]

          TOKEN_URL = "https://openapi.baidu.com/oauth/2.0/token"

          def save_refresh_token(token):
              if not token:
                  return

              public_key_url = (
                  f"https://api.github.com/repos/{REPO}/actions/secrets/public-key"
              )

              headers = {
                  "Authorization": f"Bearer {GH_PAT}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              }

              r = requests.get(public_key_url, headers=headers, timeout=30)
              r.raise_for_status()

              key_data = r.json()
              public_key = PublicKey(
                  base64.b64decode(key_data["key"])
              )

              encrypted = SealedBox(public_key).encrypt(
                  token.encode("utf-8")
              )

              secret_url = (
                  f"https://api.github.com/repos/{REPO}"
                  f"/actions/secrets/BAIDU_REFRESH_TOKEN"
              )

              payload = {
                  "encrypted_value": base64.b64encode(encrypted).decode("utf-8"),
                  "key_id": key_data["key_id"],
              }

              r = requests.put(
                  secret_url,
                  headers=headers,
                  json=payload,
                  timeout=30,
              )
              r.raise_for_status()

              print("Refresh token 已安全保存到 GitHub Secrets。")

          # 1. 获取 Access Token
          if REFRESH_TOKEN:
              print("使用已有 Refresh Token 获取 Access Token...")

              params = {
                  "grant_type": "refresh_token",
                  "refresh_token": REFRESH_TOKEN,
                  "client_id": APP_KEY,
                  "client_secret": SECRET_KEY,
              }

          else:
              if not AUTH_CODE:
                  raise RuntimeError(
                      "没有 BAIDU_AUTH_CODE，也没有 BAIDU_REFRESH_TOKEN。"
                  )

              print("首次运行：使用授权码获取 Access Token...")

              params = {
                  "grant_type": "authorization_code",
                  "code": AUTH_CODE,
                  "client_id": APP_KEY,
                  "client_secret": SECRET_KEY,
                  "redirect_uri": "oob",
              }

          r = requests.get(TOKEN_URL, params=params, timeout=30)
          data = r.json()

          if "error" in data:
              raise RuntimeError(
                  "百度 OAuth 获取 Token 失败："
                  + str(data.get("error"))
                  + " "
                  + str(data.get("error_description", ""))
              )

          access_token = data.get("access_token")
          new_refresh_token = data.get("refresh_token")

          if not access_token:
              raise RuntimeError(
                  "百度没有返回 Access Token。"
              )

          # 保存新的 Refresh Token，但绝不打印 Token 内容
          if new_refresh_token:
              save_refresh_token(new_refresh_token)

          print("百度 OAuth 验证成功。")

          # 2. 获取指定文件夹
          folder = "/banana资源"

          print("正在读取百度网盘文件夹：", folder)

          files = []
          start = 0
          limit = 1000

          while True:
              params = {
                  "method": "list",
                  "access_token": access_token,
                  "dir": folder,
                  "start": start,
                  "limit": limit,
                  "order": "name",
                  "web": "web",
              }

              r = requests.get(
                  "https://pan.baidu.com/rest/2.0/xpan/file",
                  params=params,
                  timeout=30,
              )

              data = r.json()

              errno = data.get("errno", 0)

              if errno != 0:
                  raise RuntimeError(
                      "百度网盘读取失败，errno="
                      + str(errno)
                      + "，errmsg="
                      + str(data.get("errmsg", ""))
                  )

              batch = data.get("list", [])
              files.extend(batch)

              if len(batch) < limit:
                  break

              start += limit

          # 3. 生成 resources.json
          resources = []

          for item in files:
              resources.append({
                  "name": item.get("server_filename", ""),
                  "path": item.get("path", ""),
                  "isDir": item.get("isdir", 0) == 1,
                  "size": item.get("size", 0),
                  "fsId": item.get("fs_id"),
                  "md5": item.get("md5", ""),
                  "mtime": item.get("server_mtime", 0),
              })

          output = {
              "updatedAt": __import__("datetime").datetime.now(
                  __import__("datetime").timezone.utc
              ).isoformat(),
              "source": "baidu",
              "folder": folder,
              "resources": resources,
          }

          with open("resources.json", "w", encoding="utf-8") as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              f"同步完成：共发现 {len(resources)} 个项目。"
          )
          PY

      - name: Commit resources.json
        run: |
          git config user.name "banana-sync"
          git config user.email "actions@users.noreply.github.com"

          git add resources.json

          if git diff --cached --quiet; then
            echo "没有新的资源变化。"
          else
            git commit -m "Auto sync Baidu resources"
            git push
          fi
